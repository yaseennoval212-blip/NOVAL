<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب المنتج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; direction: rtl; font-family: Arial, sans-serif; }
    .error { color: red; font-size: 0.9rem; display: none; margin-top: 5px; }
    #whatsappBtn { background-color: #25D366; border: none; }
    #whatsappBtn:hover { background-color: #1ebe57; }
  </style>
</head>
<body>

<div class="container">
  <h2 class="mb-4">طلب المنتج</h2>
  <form id="orderForm">
    <div class="mb-3">
      <label class="form-label">اسم المنتج</label>
      <input type="text" class="form-control" id="product">
      <div class="error" id="productError">من فضلك املأ اسم المنتج</div>
    </div>
    <div class="mb-3">
      <label class="form-label">الاسم الكامل</label>
      <input type="text" class="form-control" id="fullName">
      <div class="error" id="nameError">من فضلك املأ الاسم الكامل</div>
    </div>
    <div class="mb-3">
      <label class="form-label">رقم الهاتف</label>
      <input type="number" class="form-control" id="phone">
      <div class="error" id="phoneError">من فضلك املأ رقم الهاتف</div>
    </div>
    <div class="mb-3">
      <label class="form-label">العنوان بالكامل</label>
      <textarea class="form-control" id="address" rows="2"></textarea>
      <div class="error" id="addressError">من فضلك املأ العنوان بالكامل</div>
    </div>
    <div class="mb-3">
      <label class="form-label">اسم الشارع</label>
      <input type="text" class="form-control" id="street">
      <div class="error" id="streetError">من فضلك املأ اسم الشارع</div>
    </div>
    <div class="mb-3">
      <label class="form-label">الكمية</label>
      <input type="number" class="form-control" id="quantity" min="1">
      <div class="error" id="quantityError">من فضلك املأ الكمية</div>
    </div>

    <button type="button" id="whatsappBtn" class="btn btn-success w-20">لطلب المنتج</button>
  </form>
</div>

<script>
document.getElementById('whatsappBtn').addEventListener('click', function() {
  // جلب القيم
  let product = document.getElementById('product').value.trim();
  let fullName = document.getElementById('fullName').value.trim();
  let phone = document.getElementById('phone').value.trim();
  let street = document.getElementById('street').value.trim();
  let address = document.getElementById('address').value.trim();
  let quantity = document.getElementById('quantity').value.trim();

  // إخفاء كل الأخطاء
  document.querySelectorAll('.error').forEach(e => e.style.display = 'none');

  let hasError = false;

  if(product === '') { document.getElementById('productError').style.display = 'block'; hasError = true; }
  if(fullName === '') { document.getElementById('nameError').style.display = 'block'; hasError = true; }
  if(phone === '') { document.getElementById('phoneError').style.display = 'block'; hasError = true; }
  if(street === '') { document.getElementById('streetError').style.display = 'block'; hasError = true; }
  if(address === '') { document.getElementById('addressError').style.display = 'block'; hasError = true; }
  if(quantity === '') { document.getElementById('quantityError').style.display = 'block'; hasError = true; }

  if(hasError) return; // يمنع الانتقال لو فيه حقل فاضي

  // إنشاء رسالة WhatsApp باستخدام Template Literals صح
  let message = encodeURIComponent(`طلب جديد:
اسم المنتج: ${product}
الاسم الكامل: ${fullName}
رقم الهاتف: ${phone}
اسم الشارع: ${street}
العنوان: ${address}
الكمية: ${quantity}`);

  let whatsappNumber = '201094492277'; // ضع رقمك هنا
  let url =`https://wa.me/${whatsappNumber}?text=${message}`;

  window.open(url, '_blank'); // فتح واتساب في تبويب جديد
});
</script>

</body>
</html>
